<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨侠算术</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen ink-on-rice-paper game; header + swappable screens; battle = banner / arena / question desk */
:root{
  --paper:#efe5cf; --paper-2:#e4d6b8; --card:#f8f1e2; --ink:#1d1b18; --ink-soft:#575046;
  --cinnabar:#b5352b; --gold:#c98f17; --jade:#2e6a58; --sky:#2f6fb0; --violet:#7a3fa6;
  --f-display:"STKaiti","KaiTi","Kaiti SC","楷体","BiauKai","AR PL UKai CN",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  background-image:radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.55),transparent 45%),radial-gradient(ellipse at 90% 95%,rgba(120,90,40,.10),transparent 50%);}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.brand{background:none;border:0;font-family:var(--f-display);font-size:1.7rem;font-weight:700;letter-spacing:.12em;padding:0;display:flex;align-items:center;gap:10px}
.brand .stamp{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--cinnabar);color:var(--card);font-size:1.1rem;border-radius:4px;transform:rotate(-6deg);letter-spacing:0}
.topright{display:flex;align-items:center;gap:10px}
.chipbtn{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:.95rem}
.seal{display:flex;align-items:baseline;gap:6px;background:var(--cinnabar);color:var(--card);padding:4px 14px;border-radius:6px;box-shadow:2px 2px 0 var(--ink)}
.seal b{font-size:1.45rem;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.seal small{font-size:.85rem}
.coin-ico{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--card);align-self:center;position:relative}
.coin-ico::after{content:"";position:absolute;inset:4px;border:1.5px solid var(--card);border-radius:2px}
.coin-ico.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.6)}}
#screens{flex:1;min-height:0;position:relative}
.screen{height:100%;overflow-y:auto;box-sizing:border-box;padding-block:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
.btn{border:2.5px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 20px;font-size:1.15rem;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--cinnabar);color:var(--card)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums;letter-spacing:.06em;font-weight:700;white-space:nowrap}
.cn{font-family:var(--f-display);font-size:1.15em;font-weight:700;color:var(--cinnabar)}
svg.art{display:block;overflow:visible}

/* HOME */
.home{min-height:100%;display:grid;place-items:center;text-align:center}
.home-inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:980px}
.home h1{font-size:clamp(3rem,9vw,6.5rem);letter-spacing:.2em;line-height:1}
.home .sub{font-size:1.1rem;color:var(--ink-soft)}
.lineup{display:flex;gap:clamp(4px,2vw,28px);justify-content:center;align-items:flex-end;flex-wrap:wrap}
.lineup figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.lineup svg{height:clamp(110px,22vh,200px);width:auto}
.lineup figcaption{font-family:var(--f-display);font-size:1.15rem}
.lineup .locked svg{opacity:.35;filter:grayscale(1)}
.howto{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:.98rem}
.howto span{background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px}

/* MAP */
.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.map-head h2{font-size:2rem}
.curhero{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px 12px 4px 4px}
.curhero svg{height:54px;width:auto}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.chapter{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.chapter h3{font-size:1.6rem}
.chapter .unit{font-size:.95rem;color:var(--ink-soft)}
.chapter.locked{opacity:.6}
.nodes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.node{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-family:var(--f-display);font-size:1.4rem;font-weight:700;display:grid;place-items:center;position:relative}
.node.boss{width:auto;border-radius:12px;padding:0 14px;background:var(--ink);color:var(--card)}
.node.done{background:var(--jade);color:var(--card)}
.node.boss.done{background:var(--jade)}
.node:disabled{opacity:.35;cursor:not-allowed}
.node.next{box-shadow:0 0 0 4px var(--gold)}
.link{height:3px;width:12px;background:var(--ink);flex:none}
.chapter .bossline{font-size:.95rem}
.chapter .lockmsg{font-size:.95rem;color:var(--cinnabar);font-weight:700}

/* BATTLE */
#scr-battle{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:8px;padding:6px 12px}
.banner .lvl{font-family:var(--f-display);font-size:1.2rem;color:var(--gold)}
.banner .mission{font-family:var(--f-display);font-size:1.35rem;flex:1;min-width:0}
.banner .retreat{background:transparent;border:1.5px solid var(--card);color:var(--card);border-radius:999px;padding:3px 12px;font-size:.9rem}
.banner .retreat.armed{background:var(--cinnabar);border-color:var(--cinnabar)}
.arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px;min-height:0;border-bottom:3px solid var(--ink);padding-bottom:4px;overflow:hidden}
.arena .hills{position:absolute;inset:auto 0 0 0;height:70%;width:100%;pointer-events:none;opacity:.5}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0;height:100%;justify-content:flex-end;z-index:1}
.fighter .art-wrap{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%}
.fighter svg.art{height:100%;max-height:min(34vh,330px);width:auto;max-width:100%}
.fighter .art-wrap{animation:bob 2.6s ease-in-out infinite}
.enemy .art-wrap{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.hud{width:min(100%,320px);display:flex;flex-direction:column;gap:3px}
.hud .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.hud .nm small{font-family:var(--f-body);font-size:.85rem;color:var(--ink-soft);font-weight:400}
.bar{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--cinnabar);transition:width .4s ease}
.bar.hero i{background:var(--jade)}
.bar.shield{height:10px}
.bar.shield i{background:var(--sky)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.powers{display:flex;gap:6px;flex-wrap:wrap}
.power{font-size:.8rem;background:var(--ink);color:var(--card);border-radius:999px;padding:2px 9px}
.skillbtn{border:2.5px solid var(--ink);border-radius:10px;background:var(--card);padding:5px 10px;font-weight:700;font-size:.95rem;display:flex;gap:6px;align-items:center}
.skillbtn .pips{display:flex;gap:3px}
.skillbtn .pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.skillbtn .pips i.on{background:var(--gold)}
.skillbtn.ready{background:var(--gold);animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(201,143,23,.35)}}
.skillbtn:disabled{cursor:not-allowed}
.buffs{font-size:.85rem;color:var(--cinnabar);font-weight:700;min-height:1.1em}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center;z-index:1}
.vs{font-family:var(--f-display);font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;background:var(--cinnabar);color:var(--card);border-radius:8px;transform:rotate(-5deg)}
.combo{font-family:var(--f-display);font-size:1.4rem;color:var(--cinnabar);font-weight:700;min-height:1.6em;text-align:center}
.combo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
.fighter.lunge-r .art-wrap{animation:lungeR .45s ease}
.fighter.lunge-l .art-wrap{animation:lungeL .45s ease}
@keyframes lungeR{40%{transform:translateX(70px) rotate(4deg)}}
@keyframes lungeL{40%{transform:translateX(-70px) rotate(-4deg)}}
.fighter.hurt .art-wrap{animation:hurt .45s ease}
@keyframes hurt{20%{transform:translateX(-10px);filter:sepia(1) saturate(6) hue-rotate(-40deg)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}}
.fighter.dead .art-wrap{animation:inkout 1s forwards}
@keyframes inkout{to{opacity:0;transform:translateY(20px) scale(.9);filter:blur(6px)}}
.float{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:700;font-size:2.4rem;pointer-events:none;animation:floatup 1.1s ease-out forwards;z-index:5;white-space:nowrap;text-shadow:2px 2px 0 var(--card),-2px -2px 0 var(--card)}
.float.dmg{color:var(--cinnabar)}
.float.heal{color:var(--jade)}
.float.blue{color:var(--sky)}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(1.2)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.slash{position:absolute;inset:10% 0 10% 0;width:100%;height:80%;pointer-events:none;z-index:4}
.slash path{stroke-dasharray:420;stroke-dashoffset:420;animation:slash .5s ease-out forwards}
@keyframes slash{60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}

.desk{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:12px;position:relative}
.timer{position:absolute;left:12px;right:12px;top:-2px;height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--cinnabar);width:100%}
.qbox{display:flex;gap:12px;align-items:center;min-width:0}
.qtext{font-size:clamp(1.25rem,2.3vw,1.95rem);line-height:1.55;min-width:0;overflow-wrap:anywhere}
.qtag{display:inline-block;font-size:.8rem;background:var(--paper-2);border-radius:999px;padding:1px 10px;margin-bottom:4px;color:var(--ink-soft);font-weight:700}
.qfig{flex:none}
.qfig svg{height:clamp(110px,20vh,170px);width:auto;display:block}
.answer{display:flex;flex-direction:column;gap:6px;min-width:0}
.ansline{display:flex;align-items:center;gap:8px}
.ansbox{flex:1;min-width:0;min-height:52px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;letter-spacing:.06em;overflow:hidden}
.ansbox:empty::before{content:"输入答案";font-size:1.1rem;color:var(--ink-soft);letter-spacing:0;font-weight:400}
.ansunit{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.ansmeta{font-size:.82rem;color:var(--ink-soft);min-height:1.1em;text-align:right}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pad button{min-height:46px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--paper-2)}
.pad button.fn{font-size:1rem;background:var(--paper-2)}
.go{min-height:52px;border:2.5px solid var(--ink);border-radius:10px;background:var(--cinnabar);color:var(--card);font-family:var(--f-display);font-size:1.6rem;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.go:disabled{opacity:.5}
.feedback{position:absolute;inset:0;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 18px;flex-wrap:wrap;z-index:3}
.feedback.right{background:var(--card)}
.feedback .big{font-family:var(--f-display);font-size:2.2rem;font-weight:700}
.feedback.right .big{color:var(--jade)}
.feedback.wrong .big{color:var(--cinnabar)}
.feedback .exp{flex:1 1 320px;min-width:0;font-size:1.15rem;line-height:1.6}
.feedback .exp b{font-size:1.4rem}

/* RESULT */
.result{min-height:100%;display:grid;place-items:center;text-align:center}
.result-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
.result h2{font-size:clamp(3rem,8vw,5rem);letter-spacing:.2em}
.result.win h2{color:var(--cinnabar)}
.result svg.art{height:clamp(120px,25vh,220px);width:auto}
.earn{display:flex;align-items:center;gap:10px;font-size:1.4rem}
.earn .seal b{font-size:2rem}
.stats{display:flex;gap:18px;font-size:1.1rem}

/* SHOP & GEAR */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:2rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.card h3{font-size:1.5rem}
.card svg.chest{height:120px;width:auto}
.odds{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:.85rem}
.odds span{border-radius:999px;padding:1px 8px;color:var(--card)}
.price{font-family:var(--f-display);font-size:1.4rem;font-weight:700;display:flex;align-items:center;gap:6px}
.price .coin-ico{border-color:var(--ink)}
.price .coin-ico::after{border-color:var(--ink)}
.pending{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.pending h3{font-size:1.4rem}
.pending-list{display:flex;gap:10px;flex-wrap:wrap}
.pchest{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:6px 10px}
.pchest svg{height:46px;width:auto}
.gear-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:16px}
.gear-top svg.art{height:clamp(130px,24vh,210px);width:auto}
.statline{display:flex;gap:16px;flex-wrap:wrap;font-size:1.2rem}
.statline b{font-family:var(--f-display);font-size:1.6rem}
.slots{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.slot{display:flex;align-items:center;gap:8px;border:2px dashed var(--ink-soft);border-radius:10px;padding:6px 10px;min-width:180px}
.slot svg{width:36px;height:36px}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin-bottom:18px}
.charcard svg.art{height:120px;width:auto}
.charcard.cur{box-shadow:0 0 0 4px var(--gold)}
.charcard p{margin:0;font-size:.92rem}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.item{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item svg{width:48px;height:48px}
.item .nm{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.item .tag{font-size:.78rem;color:var(--card);border-radius:999px;padding:1px 8px}
.item.eq{box-shadow:0 0 0 4px var(--jade)}
.item button{border:2px solid var(--ink);border-radius:8px;background:var(--paper);padding:3px 12px;font-weight:700}
.empty{color:var(--ink-soft);padding:16px;border:2px dashed var(--ink-soft);border-radius:12px;text-align:center}
.danger{margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.danger button{border:2px solid var(--cinnabar);color:var(--cinnabar);background:transparent;border-radius:8px;padding:4px 12px}
.danger button.solid{background:var(--cinnabar);color:var(--card)}

/* MODAL (chest) */
.modal{position:fixed;inset:0;background:rgba(29,27,24,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal-card{background:var(--card);border:3px solid var(--ink);border-radius:16px;width:min(760px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;position:relative}
.modal-card h3{font-size:1.7rem;text-align:center}
.chest-stage{display:grid;place-items:center;position:relative}
.chest-stage svg.chest{height:clamp(110px,22vh,170px);width:auto}
.chest-lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.opened .chest-lid{transform:translate(-6px,-26px) rotate(-18deg)}
.rays{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .4s}
.opened .rays{opacity:1;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:hurt .45s}
.loot{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .5s}
.loot svg{width:80px;height:80px}
.loot .nm{font-family:var(--f-display);font-size:2rem;font-weight:700}
.closex{position:absolute;right:10px;top:8px;border:2px solid var(--ink);background:var(--paper);border-radius:8px;padding:2px 10px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:1.05rem;pointer-events:none}

@media (max-width:760px){
  .desk{grid-template-columns:1fr}
  .qbox{flex-direction:column;align-items:flex-start}
  .fighter svg.art{max-height:24vh}
  .vs{width:40px;height:40px;font-size:1.5rem}
  .hud .nm{font-size:1.05rem}
  #scr-battle{overflow-y:auto;grid-template-rows:auto minmax(220px,1fr) auto}
  .gear-top{grid-template-columns:1fr;justify-items:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="flame" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.06" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <button class="brand" id="brandBtn" type="button"><span class="stamp">墨</span>墨侠算术</button>
    <div class="topright">
      <button class="chipbtn" id="soundBtn" type="button">音效：开</button>
      <div class="seal" title="金币"><span class="coin-ico" id="coinIco"></span><b id="coinNum">0</b><small>金币</small></div>
    </div>
  </header>
  <main id="screens">
    <section id="scr-home" class="screen"></section>
    <section id="scr-map" class="screen" hidden></section>
    <section id="scr-battle" class="screen" hidden></section>

/* ============ MATH HELPERS ============ */
const CN='零一二三四五六七八九';
function readGroup(n){const u=['千','百','十',''];const s=String(n).padStart(4,'0');let r='',z=false;for(let i=0;i<4;i++){const d=+s[i];if(d===0){if(r)z=true}else{if(z){r+='零';z=false}r+=CN[d]+u[i]}}return r}
function toCN(n){if(n===0)return'零';const g=[Math.floor(n/1e8),Math.floor(n/1e4)%1e4,n%1e4],un=['亿','万',''];let r='',need=false;
 for(let i=0;i<3;i++){const v=g[i];if(v===0){if(r)need=true;continue}if(r&&(v<1000||need))r+='零';r+=readGroup(v)+un[i];need=false}
 if(r.startsWith('一十'))r=r.slice(1);return r}
function randBig(len,zp=.25){let s=String(ri(1,9));for(let i=1;i<len;i++)s+=Math.random()<zp?'0':String(ri(1,9));return Number(s)}
const N=n=>`<span class="num">${n}</span>`;
const PLACE=['个','十','百','千','万','十万','百万','千万','亿','十亿','百亿','千亿'];

function pt(cx,cy,r,deg){const a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy-r*Math.sin(a)]}
function arcPath(cx,cy,r,a1,a2){const [x1,y1]=pt(cx,cy,r,a1),[x2,y2]=pt(cx,cy,r,a2);return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${x2.toFixed(1)} ${y2.toFixed(1)}`}
const figWrap=(inner,vb)=>`<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
function figClock(h){let t='';for(let i=0;i<60;i++){const [x1,y1]=pt(80,80,70,90-i*6),[x2,y2]=pt(80,80,i%5?66:60,90-i*6);t+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${INK}" stroke-width="${i%5?1:2.5}"/>`}
 for(let i=1;i<=12;i++){const [x,y]=pt(80,80,50,90-i*30);t+=`<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" font-size="14" text-anchor="middle" font-weight="700" fill="${INK}">${i}</text>`}
 const [hx,hy]=pt(80,80,36,90-h*30);
 return figWrap(`<circle cx="80" cy="80" r="74" fill="${PAPER}" stroke="${INK}" stroke-width="4"/>${t}<line x1="80" y1="80" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><line x1="80" y1="80" x2="80" y2="20" stroke="${RED}" stroke-width="3.5" stroke-linecap="round"/><circle cx="80" cy="80" r="5" fill="${INK}"/>`,'0 0 160 160')}
function figStraight(x){const O=[110,110];const [ex,ey]=pt(110,110,95,x);
 const [l1x,l1y]=pt(110,110,40,x/2),[l2x,l2y]=pt(110,110,48,(x+180)/2);
 return figWrap(`<line x1="10" y1="110" x2="210" y2="110" stroke="${INK}" stroke-width="3"/><line x1="110" y1="110" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${INK}" stroke-width="3"/>
 <path d="${arcPath(110,110,24,0,x)}" fill="none" stroke="${RED}" stroke-width="2.5"/><path d="${arcPath(110,110,32,x,180)}" fill="none" stroke="${JADE}" stroke-width="2.5"/>
 <text x="${l1x.toFixed(1)}" y="${(l1y+6).toFixed(1)}" font-size="17" font-weight="700" fill="${RED}" text-anchor="middle">1</text><text x="${l2x.toFixed(1)}" y="${(l2y+6).toFixed(1)}" font-size="17" font-weight="700" fill="${JADE}" text-anchor="middle">2</text><circle cx="110" cy="110" r="3.5" fill="${INK}"/>`,'0 0 220 125')}
function figRight(x){const [ex,ey]=pt(30,140,120,x);const [l1x,l1y]=pt(30,140,44,x/2),[l2x,l2y]=pt(30,140,52,(x+90)/2);
 return figWrap(`<line x1="30" y1="140" x2="170" y2="140" stroke="${INK}" stroke-width="3"/><line x1="30" y1="140" x2="30" y2="10" stroke="${INK}" stroke-width="3"/><path d="M30 126 L44 126 L44 140" fill="none" stroke="${INK}" stroke-width="2"/>

function anim(fid,cls){const f=$(fid);if(!f)return;f.classList.remove(cls);void f.offsetWidth;f.classList.add(cls);setTimeout(()=>f.classList.remove(cls),500)}
function slash(fid,color){const f=$(fid);if(!f)return;const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 200 200');s.setAttribute('class','slash');s.setAttribute('preserveAspectRatio','none');
 s.innerHTML=`<path d="M20 30 Q100 90 180 170" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" filter="url(#rough)"/><path d="M180 40 Q110 100 30 160" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" opacity=".7" filter="url(#rough)"/>`;f.appendChild(s);setTimeout(()=>s.remove(),600)}

function nextQ(){if(!B||B.over)return;
 const topic=pick(B.C.topics);B.q=genQ(topic,B.d);
 $('#qText').innerHTML=`<span class="qtag">${TOPIC_NAME[topic]}</span><br>${B.q.text}`;
 const fig=$('#qFig');fig.innerHTML=B.q.fig||'';fig.hidden=!B.q.fig;
 $('#fb').hidden=true;pad.clear();pad.setUnit(B.q.unit);pad.lock(false);B.busy=false;keyHandler=battleKey;
 if(B.e.powers.includes('timer'))startTimer(60)}
function battleKey(k){if(!B||screen!=='battle')return false;if(B.review){if(k==='Enter'||k===' '){continueAfterReview();return true}return false}if(B.busy)return false;return pad.press(k)}
function startTimer(sec){stopTimer();B.tLeft=sec*10;B.tTotal=sec*10;const bar=$('#timer i');bar.style.width='100%';
 timerId=setInterval(()=>{if(!B||B.busy){return}B.tLeft--;bar.style.width=(B.tLeft/B.tTotal*100)+'%';if(B.tLeft<=0){stopTimer();B.busy=true;pad.lock(true);onWrong(true)}},100)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

function submitAnswer(v){if(!B||B.busy||B.over)return;B.busy=true;pad.lock(true);stopTimer();
 if(Number(v)===B.q.ans)onRight();else onWrong(false)}

function dealDamage(dmg,ignoreShield){const e=B.e;let absorbed=0;
 if(!ignoreShield&&e.shield>0){absorbed=Math.min(e.shield,dmg);e.shield-=absorbed;dmg-=absorbed}
 e.hp=Math.max(0,e.hp-dmg);
 if(absorbed)floatText('#fEnemy','护盾 −'+absorbed,'blue');
 if(dmg>0)setTimeout(()=>floatText('#fEnemy','−'+dmg,'dmg'),absorbed?250:0);
 if(e.powers.includes('shield')&&!B.regenUsed&&e.hp>0&&e.hp<=e.max/2){B.regenUsed=true;e.shield=e.shieldMax;setTimeout(()=>{floatText('#fEnemy','护盾重生！','blue');updateHud()},700)}}

function onRight(){SFX.right();B.rights++;S.stats.right++;B.combo++;B.gauge=Math.min(3,B.gauge+1);
 const bonus=1+.1*Math.min(B.combo-1,5);const dmg=Math.round(B.hero.atk*bonus*B.mult);const big=B.mult>1;B.mult=1;
 const fb=$('#fb');fb.className='feedback right';fb.innerHTML=`<span class="big">答对了！</span><span class="exp">${B.combo>1?`连击 ×${B.combo}，伤害加成 ${Math.round((bonus-1)*100)}%`:'出招！'}</span>`;fb.hidden=false;
 const cb=$('#combo');cb.textContent=B.combo>1?`连击 ×${B.combo}`:'';cb.classList.remove('pop');void cb.offsetWidth;cb.classList.add('pop');
 anim('#fHero','lunge-r');
 setTimeout(()=>{if(!B||B.over)return;SFX.hit();slash('#fEnemy',big?GOLD:INK);anim('#fEnemy','hurt');dealDamage(dmg,false);updateHud();
  if(B.e.hp<=0)enemyDown();else setTimeout(()=>{if(B&&!B.over)nextQ()},1080)},220)}

function enemyDown(){B.over=true;stopTimer();keyHandler=null;setTimeout(()=>{$('#fEnemy').classList.add('dead')},300);setTimeout(()=>finishBattle(true),1400)}

function onWrong(timeout){SFX.wrong();B.wrongs++;S.stats.wrong++;B.combo=0;$('#combo').textContent='';
 const e=B.e,q=B.q;
 const fb=$('#fb');fb.className='feedback wrong';
 fb.innerHTML=`<span class="big">${timeout?'时间到！':'答错了'}</span><div class="exp"><b>正确答案：${N(q.ans)}${q.unit&&q.unit!=='位数'?' '+q.unit:''}</b><br>${q.explain}</div><button class="btn primary" type="button" id="fbGo">继续 ▶</button>`;fb.hidden=false;
 $('#fbGo').onclick=continueAfterReview;B.review=true;
 setTimeout(()=>{anim('#fEnemy','lunge-l');
  setTimeout(()=>{SFX.hit();
   if(B.blocks>0){B.blocks--;floatText('#fHero','挡住了！','blue')}
   else{const dmg=Math.max(1,e.atk+ri(-2,2));B.hero.hp=Math.max(0,B.hero.hp-dmg);slash('#fHero',RED);anim('#fHero','hurt');floatText('#fHero','−'+dmg,'dmg')}
   if(e.powers.includes('heal')&&e.hp>0){const h=Math.round(e.max*.15);e.hp=Math.min(e.max,e.hp+h);setTimeout(()=>floatText('#fEnemy','+'+h,'heal'),300)}
   updateHud()},220)},250)}
function continueAfterReview(){if(!B||!B.review)return;B.review=false;$('#fb').hidden=true;if(B.hero.hp<=0){B.over=true;$('#fHero').classList.add('dead');setTimeout(()=>finishBattle(false),900)}else nextQ()}

function useSkill(){if(!B||B.over||B.gauge<3||B.review)return;B.gauge=0;SFX.skill();const k=S.cur;
 if(k==='brush'){B.mult=3;floatText('#fHero','泼墨狂书！','dmg')}
 else if(k==='monk'){const h=Math.round(B.hero.max*.4);B.hero.hp=Math.min(B.hero.max,B.hero.hp+h);floatText('#fHero','+'+h,'heal')}
 else if(k==='hand'){B.blocks+=2;floatText('#fHero','千手护体！','blue')}
 else if(k==='reaper'){anim('#fHero','lunge-r');const dmg=Math.round(B.e.max*.3);setTimeout(()=>{SFX.hit();slash('#fEnemy','#27302a');anim('#fEnemy','hurt');dealDamage(dmg,true);updateHud();if(B.e.hp<=0){B.busy=true;pad.lock(true);enemyDown()}},220)}
 updateHud()}

/* ============ RESULT ============ */
function finishBattle(win){stopTimer();const b=B;let coins;
 if(win){coins=b.isBoss?50+20*b.ch+(b.wrongs===0?30:0):20+5*b.ch+(b.wrongs===0?10:0);if(S.prog[b.ch]<b.lv)S.prog[b.ch]=b.lv;S.stats.wins++;SFX.win()}
 else{coins=5;SFX.lose()}
 S.coins+=coins;save();
 const el=$('#scr-result');const perfect=win&&b.wrongs===0;
 el.innerHTML=`<div class="result ${win?'win':''}"><div class="result-inner">
  ${win?ART[S.cur]():enemyArt(b.e)}
  <h2>${win?'胜利！':'战败'}</h2>
  <p class="muted" style="margin:0;font-size:1.1rem">${win?`打败了 ${b.e.name}${perfect?'，而且一题都没错，额外奖励！':''}`:`${b.e.name} 太强了，换个装备再来！`}</p>
  <div class="stats"><span>答对 <b>${b.rights}</b> 题</span><span>答错 <b>${b.wrongs}</b> 题</span></div>
  <div class="earn">获得 <div class="seal"><span class="coin-ico"></span><b id="earnNum">+0</b><small>金币</small></div></div>
  <div class="row" style="justify-content:center">
   <button class="btn gold" type="button" id="rShop">去宝箱铺开宝箱</button>
   ${win&&b.lv<5?'<button class="btn primary" type="button" id="rNext">下一关</button>':''}
   ${!win?'<button class="btn primary" type="button" id="rAgain">再战一次</button>':''}
   <button class="btn" type="button" id="rMap">返回地图</button>
  </div></div></div>`;
 show('result');
 let n=0;const step=Math.max(1,Math.ceil(coins/20));const iv=setInterval(()=>{n=Math.min(coins,n+step);$('#earnNum').textContent='+'+n;if(n%3===0||n===coins)SFX.coin();if(n>=coins){clearInterval(iv);updateCoins(true)}},50);
 $('#rShop').onclick=renderShop;$('#rMap').onclick=renderMap;
 if($('#rNext'))$('#rNext').onclick=()=>startBattle(b.ch,b.lv+1);
 if($('#rAgain'))$('#rAgain').onclick=()=>startBattle(b.ch,b.lv);
 B=null}

/* ============ SHOP & CHESTS ============ */
function renderShop(){
 const el=$('#scr-shop');
 el.innerHTML=`<div class="sec-head"><div><h2>宝箱铺</h2><p class="muted" style="margin:4px 0 0">用金币买宝箱，答对一道题就能打开，里面随机是武器或盔甲。</p></div><button class="btn" type="button" id="sBack">返回地图</button></div>
 <div class="grid3">${CHESTS.map((c,i)=>`<div class="card">${chestSVG(i)}<h3>${c.name}</h3>
  <div class="odds">${c.w.map((w,r)=>w?`<span style="background:${RAR[r].c}">${RAR[r].n} ${w}%</span>`:'').join('')}</div>
  <div class="price"><span class="coin-ico"></span>${c.price}</div>
  <button class="btn ${S.coins>=c.price?'primary':''}" type="button" data-buy="${i}" ${S.coins>=c.price?'':'disabled'}>${S.coins>=c.price?'购买并开启':'金币不够'}</button></div>`).join('')}</div>
 <div class="pending"><h3>还没打开的宝箱</h3>${S.chests.length?`<div class="pending-list">${S.chests.map((t,i)=>`<div class="pchest">${chestSVG(t)}<b>${CHESTS[t].name}</b><button class="chipbtn" type="button" data-open="${i}">开启</button></div>`).join('')}</div>`:'<div class="empty">没有待开启的宝箱。打赢战斗赚金币，再来买吧！</div>'}</div>`;
 el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const t=+b.dataset.buy;if(S.coins<CHESTS[t].price)return;S.coins-=CHESTS[t].price;S.chests.push(t);save();updateCoins(true);SFX.coin();openChest(S.chests.length-1)});
 el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openChest(+b.dataset.open));
 $('#sBack').onclick=renderMap;
 show('shop')}

function rollItem(tier){const w=CHESTS[tier].w;let r=Math.random()*100,rar=0;for(let i=0;i<4;i++){if(r<w[i]){rar=i;break}r-=w[i]}
 const type=Math.random()<.5?'w':'a';const[lo,hi]=RANGE[type][rar];return{id:S.nextId++,type,rar,val:ri(lo,hi),name:pick(NAMES[type][rar])}}

let chestCtx=null;
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';chestCtx=null;if(screen==='shop')renderShop()}
function openChest(idx){
 const tier=S.chests[idx];const m=$('#modal');
 m.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="开宝箱"><button class="closex" type="button" id="cClose">稍后再开</button>
  <h3>${CHESTS[tier].name}</h3><div class="chest-stage" id="cStage">${chestSVG(tier)}</div>
  <div id="cBody"></div></div>`;
 m.hidden=false;$('#cClose').onclick=closeModal;
 chestCtx={idx,tier};askChest()}
function askChest(){const ctx=chestCtx;if(!ctx)return;const topic=pick(['u1','u2','u3','u4']);const q=genQ(topic,ctx.tier+1);ctx.q=q;
 const body=$('#cBody');
 body.innerHTML=`<div class="qbox" style="margin-bottom:10px"><div class="qtext"><span class="qtag">开锁题 · ${TOPIC_NAME[topic]}</span><br>${q.text}</div>${q.fig?`<div class="qfig">${q.fig}</div>`:''}</div><div class="answer" id="cPad"></div>`;
 const p=makePad($('#cPad'),v=>{p.lock(true);if(Number(v)===q.ans)chestOpen();else chestWrong()});p.setUnit(q.unit);
 keyHandler=k=>p.press(k)}
function chestWrong(){SFX.wrong();const q=chestCtx.q;const st=$('#cStage svg');st.classList.remove('shake');void st.getBoundingClientRect();st.classList.add('shake');
 $('#cBody').innerHTML=`<div class="feedback wrong" style="position:static"><span class="big">锁没打开</span><div class="exp"><b>正确答案：${N(q.ans)}${q.unit&&q.unit!=='位数'?' '+q.unit:''}</b><br>${q.explain}</div><button class="btn primary" type="button" id="cRetry">换一题再试</button></div>`;
 $('#cRetry').onclick=askChest;keyHandler=k=>{if(k==='Enter'){askChest();return true}return false}}
function chestOpen(){const ctx=chestCtx;SFX.chest();S.chests.splice(ctx.idx,1);const it=rollItem(ctx.tier);S.inv.push(it);save();
 $('#cStage svg').classList.add('opened');$('#cClose').textContent='关闭';
 const cur=it.type==='w'?S.inv.find(i=>i.id===S.eq.w):S.inv.find(i=>i.id===S.eq.a);
 const better=!cur||it.val>cur.val;
 $('#cBody').innerHTML=`<div class="loot">${itemIcon(it)}<span style="background:${RAR[it.rar].c};color:${PAPER};border-radius:999px;padding:1px 10px;font-size:.9rem">${RAR[it.rar].n}${it.type==='w'?'武器':'盔甲'}</span>
  <div class="nm" style="color:${RAR[it.rar].c}">${it.name}</div><div style="font-size:1.3rem;font-weight:700">${it.type==='w'?'攻击':'生命'} +${it.val}</div>
  <div class="muted">${cur?`现在装备的是 ${cur.name}（+${cur.val}）`:'你还没有装备这一类物品'}</div>
  <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ${better?'primary':''}" type="button" id="cEquip">立即装备</button><button class="btn" type="button" id="cKeep">放进背包</button></div></div>`;
 $('#cEquip').onclick=()=>{S.eq[it.type]=it.id;save();toast('已装备 '+it.name);closeModal()};
 $('#cKeep').onclick=closeModal;keyHandler=null}

/* ============ GEAR ============ */
let resetArmed=false;
function renderGear(){
 const el=$('#scr-gear');const hs=heroStats();const c=CHARS[S.cur];
 const inv=S.inv.slice().sort((a,b)=>a.type.localeCompare(b.type)||b.rar-a.rar||b.val-a.val);
 const slot=(it,label)=>`<div class="slot">${it?itemIcon(it):'<svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="8" fill="none" stroke="#575046" stroke-width="2" stroke-dasharray="4 4"/></svg>'}<div><div class="muted" style="font-size:.8rem">${label}</div><b>${it?`${it.name} +${it.val}`:'空'}</b></div></div>`;
 el.innerHTML=`<div class="sec-head"><h2>角色与装备</h2><button class="btn" type="button" id="gBack">返回地图</button></div>
 <div class="gear-top">${ART[S.cur]()}<div><h3 style="font-size:2rem">${c.name}</h3>
  <div class="statline"><span>攻击 <b>${hs.atk}</b> <small class="muted">(${c.atk}${hs.w?' + '+hs.w.val:''})</small></span><span>生命 <b>${hs.hp}</b> <small class="muted">(${c.hp}${hs.a?' + '+hs.a.val:''})</small></span></div>
  <p style="margin:6px 0 0">技能 <b>${c.skill}</b>：${c.desc}（答对3题充满）</p>
  <div class="slots">${slot(hs.w,'武器')}${slot(hs.a,'盔甲')}</div></div></div>
 <h3 style="font-size:1.5rem;margin-bottom:8px">角色</h3>
 <div class="chars">${CHAR_ORDER.map(k=>{const C=CHARS[k],own=S.chars.includes(k),cur=S.cur===k;return `<div class="card charcard ${cur?'cur':''}">${ART[k]()}<h3>${C.name}</h3><p>生命 ${C.hp} · 攻击 ${C.atk}</p><p class="muted">${C.skill}：${C.desc}</p>
  ${cur?'<button class="btn" type="button" disabled>使用中</button>':own?`<button class="btn primary" type="button" data-use="${k}">选择</button>`:`<button class="btn gold" type="button" data-hire="${k}" ${S.coins>=C.price?'':'disabled'}>招募 · ${C.price}金币</button>`}</div>`}).join('')}</div>
 <h3 style="font-size:1.5rem;margin-bottom:8px">背包（${S.inv.length}）</h3>
 ${inv.length?`<div class="inv">${inv.map(it=>{const eq=S.eq[it.type]===it.id;return `<div class="item ${eq?'eq':''}">${itemIcon(it)}<span class="tag" style="background:${RAR[it.rar].c}">${RAR[it.rar].n}${it.type==='w'?'武器':'盔甲'}</span><span class="nm">${it.name}</span><span>${it.type==='w'?'攻击':'生命'} +${it.val}</span>${eq?'<button type="button" disabled>已装备</button>':`<button type="button" data-eq="${it.id}">装备</button>`}</div>`}).join('')}</div>`:'<div class="empty">背包是空的。去宝箱铺开宝箱，就能得到武器和盔甲。</div>'}
 <div class="danger"><span class="muted">金币和装备会一直保存在这台电脑的浏览器里。</span>${resetArmed?'<b style="color:var(--cinnabar)">确定要清除全部金币、角色和装备吗？</b><button class="solid" type="button" id="gResetYes">确定清除</button><button type="button" id="gResetNo">取消</button>':'<button type="button" id="gReset">清除存档</button>'}</div>`;
 $('#gBack').onclick=()=>{resetArmed=false;renderMap()};
 el.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.use;save();renderGear()});
 el.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{const k=b.dataset.hire;if(S.coins<CHARS[k].price)return;S.coins-=CHARS[k].price;S.chars.push(k);S.cur=k;save();updateCoins(true);SFX.chest();toast('招募成功：'+CHARS[k].name);renderGear()});
 el.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{const it=S.inv.find(i=>i.id===+b.dataset.eq);S.eq[it.type]=it.id;save();SFX.coin();renderGear()});
 if($('#gReset'))$('#gReset').onclick=()=>{resetArmed=true;renderGear()};
 if($('#gResetNo'))$('#gResetNo').onclick=()=>{resetArmed=false;renderGear()};
 if($('#gResetYes'))$('#gResetYes').onclick=()=>{const snd=S.sound;S=defaultSave();S.sound=snd;resetArmed=false;save();updateCoins();toast('存档已清除');renderGear()};
 const sc=el.scrollTop;show('gear');el.scrollTop=sc}

/* ============ BOOT ============ */
window.__moxia={genQ,toCN,BANK};
$('#soundBtn').textContent='音效：'+(S.sound?'开':'关');
updateCoins();renderHome();
})();
</script>

</html>
