<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨侠算术</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen ink-on-rice-paper game; header + swappable screens; battle = banner / arena / question desk */
:root{
  --paper:#efe5cf; --paper-2:#e4d6b8; --card:#f8f1e2; --ink:#1d1b18; --ink-soft:#575046;
  --cinnabar:#b5352b; --gold:#c98f17; --jade:#2e6a58; --sky:#2f6fb0; --violet:#7a3fa6;
  --f-display:"STKaiti","KaiTi","Kaiti SC","楷体","BiauKai","AR PL UKai CN",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  background-image:radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.55),transparent 45%),radial-gradient(ellipse at 90% 95%,rgba(120,90,40,.10),transparent 50%);}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.brand{background:none;border:0;font-family:var(--f-display);font-size:1.7rem;font-weight:700;letter-spacing:.12em;padding:0;display:flex;align-items:center;gap:10px}
.brand .stamp{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--cinnabar);color:var(--card);font-size:1.1rem;border-radius:4px;transform:rotate(-6deg);letter-spacing:0}
.topright{display:flex;align-items:center;gap:10px}
.chipbtn.homebtn{font-weight:700;background:var(--ink);color:var(--card)}
.chipbtn.homebtn.armed{background:var(--cinnabar)}
.chipbtn{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:.95rem}
.seal{display:flex;align-items:baseline;gap:6px;background:var(--cinnabar);color:var(--card);padding:4px 14px;border-radius:6px;box-shadow:2px 2px 0 var(--ink)}
.seal b{font-size:1.45rem;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.seal small{font-size:.85rem}
.coin-ico{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--card);align-self:center;position:relative}
.coin-ico::after{content:"";position:absolute;inset:4px;border:1.5px solid var(--card);border-radius:2px}
.coin-ico.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.6)}}
#screens{flex:1;min-height:0;position:relative}
.screen{height:100%;overflow-y:auto;box-sizing:border-box;padding-block:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
.btn{border:2.5px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 20px;font-size:1.15rem;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--cinnabar);color:var(--card)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums;letter-spacing:.06em;font-weight:700;white-space:nowrap}
.cn{font-family:var(--f-display);font-size:1.15em;font-weight:700;color:var(--cinnabar)}
svg.art{display:block;overflow:visible}

/* HOME */
.home{min-height:100%;display:grid;place-items:center;text-align:center}
.home-inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:980px}
.home h1{font-size:clamp(3rem,9vw,6.5rem);letter-spacing:.2em;line-height:1}
.home .sub{font-size:1.1rem;color:var(--ink-soft)}
.lineup{display:flex;gap:clamp(4px,2vw,28px);justify-content:center;align-items:flex-end;flex-wrap:wrap}
.lineup figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.lineup svg{height:clamp(80px,16vh,150px);width:auto}
.lineup figcaption{font-family:var(--f-display);font-size:1.15rem}
.lineup .locked svg{opacity:.35;filter:grayscale(1)}
.howto{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:.98rem}
.howto span{background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px}

/* MAP */
.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.map-head h2{font-size:2rem}
.curhero{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px 12px 4px 4px}
.curhero svg{height:54px;width:auto}
.potbar{display:flex;gap:4px;flex-wrap:wrap}
.potbtn{display:flex;align-items:center;gap:2px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);padding:1px 8px 1px 2px;font-size:.78rem;font-weight:700}
.potbtn svg{width:20px;height:20px}
.potbtn:disabled{opacity:.45}
.picon{width:72px;height:72px}
.shoph{font-size:1.5rem;margin:14px 0 8px}
.card.locked{opacity:.6}
.dropline{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:700}
.dropline svg.chest{height:44px;width:auto}
.codebox{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.codebox h3{font-size:1.6rem}
.codebox input{flex:1;min-width:0;font-size:1.4rem;padding:8px 12px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);text-transform:uppercase;letter-spacing:.08em}
.codemsg{min-height:1.4em;font-size:1.15rem;font-weight:700}
.codemsg .good{color:var(--jade)}
.codemsg .bad{color:var(--cinnabar)}
.homepage{display:flex;flex-direction:column;gap:14px;max-width:1240px;margin:0 auto}
.hero-banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;border:3px solid var(--ink);border-radius:18px;padding:14px 24px;position:relative;overflow:hidden;background:var(--card);isolation:isolate}
.hb-bg{position:absolute;inset:0;opacity:.35;z-index:-1}
.hb-bg .bgscene{z-index:0}
.hb-art svg.art{height:clamp(130px,26vh,230px);width:auto}
.hb-text{display:flex;flex-direction:column;gap:8px;min-width:0}
.hb-text h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:.18em;line-height:1}
.hb-text .sub{margin:0;color:var(--ink-soft);font-size:1.1rem}
.hb-hero{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;align-self:flex-start;font-size:1rem}
.btn.big{font-size:1.35rem;padding:12px 26px}
.stats6{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:1.9rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--ink-soft)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.menucard{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;text-align:left;box-shadow:4px 4px 0 var(--ink);min-width:0}
.menucard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.menucard .mi{width:96px;height:84px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:10px;position:relative}
.menucard .mi svg{height:84px;width:auto;max-width:96px}
.mini-scene{position:absolute;inset:0}
.mini-scene .bgscene{z-index:0}
.menucard h3{font-size:1.5rem}
.menucard p{margin:2px 0 0;font-size:.9rem;color:var(--ink-soft)}
.menucard.primary{background:var(--cinnabar);color:var(--card)}
.menucard.primary p{color:var(--card)}
.homepage .lineup svg{height:clamp(70px,11vh,110px)}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.bookcard{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.bookcard svg.art{height:110px;width:auto}
.bookcard.unseen svg.art{filter:brightness(0);opacity:.25}
.bookcard.boss{border-color:var(--cinnabar);box-shadow:0 0 0 3px rgba(181,53,43,.25)}
.bookcard b{font-family:var(--f-display);font-size:1.2rem}
.bookcard p{margin:0;font-size:.8rem}
.howlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:1.1rem;line-height:1.5}
@media (max-width:760px){.hero-banner{grid-template-columns:1fr;justify-items:center;text-align:center}.hb-hero{align-self:center}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2.5px solid var(--ink);border-radius:999px;background:var(--card);padding:6px 16px;font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.tab.on{background:var(--ink);color:var(--card)}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.chapter{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.chapter h3{font-size:1.6rem}
.chapter .unit{font-size:.95rem;color:var(--ink-soft)}
.chapter.locked{opacity:.6}
.nodes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.node{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-family:var(--f-display);font-size:1.4rem;font-weight:700;display:grid;place-items:center;position:relative}
.node.boss{width:auto;border-radius:12px;padding:0 14px;background:var(--ink);color:var(--card)}
.node.done{background:var(--jade);color:var(--card)}
.node.boss.done{background:var(--jade)}
.node:disabled{opacity:.35;cursor:not-allowed}
.node.next{box-shadow:0 0 0 4px var(--gold)}
.link{height:3px;width:12px;background:var(--ink);flex:none}
.chapter .bossline{font-size:.95rem}
.chapter .lockmsg{font-size:.95rem;color:var(--cinnabar);font-weight:700}

/* BATTLE */
#scr-battle{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:8px;padding:6px 12px}
.banner .lvl{font-family:var(--f-display);font-size:1.2rem;color:var(--gold)}
.banner .mission{font-family:var(--f-display);font-size:1.35rem;flex:1;min-width:0}
.banner .retreat{background:transparent;border:1.5px solid var(--card);color:var(--card);border-radius:999px;padding:3px 12px;font-size:.9rem}
.banner .retreat.armed{background:var(--cinnabar);border-color:var(--cinnabar)}
.arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px;min-height:0;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;overflow:hidden;isolation:isolate}
.bgscene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.world{position:absolute;top:0;bottom:0;left:0;width:160%;z-index:-1;transition:transform .12s linear}
.world .bgscene{z-index:0}
.pickup{position:absolute;bottom:22%;transform:translateX(-50%);animation:spinc 1s ease-in-out infinite;z-index:1}
.pickup .coin-ico{display:block;width:26px;height:26px;border-color:var(--ink);box-shadow:0 0 10px rgba(216,155,29,.9)}
.pickup.got{animation:gotc .5s forwards}
@keyframes spinc{50%{transform:translateX(-50%) translateY(-8px) scaleX(.5)}}
@keyframes gotc{to{transform:translateX(-50%) translateY(-60px);opacity:0}}
.fighter.enemy{transition:transform .6s cubic-bezier(.2,1.4,.5,1),opacity .4s}
.fighter.enemy.away{transform:translateX(70%);opacity:0}
.fighter.hero.walking .art-wrap{animation:none}
.fighter.hero.dashing{z-index:3}
.arena:has(.dashing) .vs{opacity:0;transition:opacity .15s}
.fighter.hero.stepping .art-wrap{animation:walkbob .3s ease-in-out}
@keyframes walkbob{30%{transform:translateY(-8px) rotate(-3deg)}70%{transform:translateY(0) rotate(2deg)}}
.walkpanel{gap:12px}
.walkbar{flex:1 1 200px;height:14px;border:2px solid var(--ink);border-radius:999px;background:var(--paper-2);overflow:hidden}
.walkbar i{display:block;height:100%;width:0;background:var(--jade);transition:width .12s linear}
.walkgo{font-size:1.4rem;padding:12px 28px;touch-action:none;user-select:none}
.fighter::before{content:"";position:absolute;left:50%;bottom:16%;width:90%;height:70%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 60%,rgba(248,241,226,.8),rgba(248,241,226,0) 68%);z-index:-1;pointer-events:none}
.guardfx{position:absolute;top:18%;height:55%;width:auto;pointer-events:none;z-index:4;animation:guard .8s ease-out forwards}
.enemy .guardfx{left:2%}
.hero .guardfx{right:2%}
@keyframes guard{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
.scene{height:96px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;position:relative;margin:-2px -2px 0}
.scene .bgscene{z-index:0}
.traits{display:flex;gap:6px;flex-wrap:wrap}
.trait{font-size:.8rem;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;background:var(--paper)}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0;height:100%;justify-content:flex-end;z-index:1}
.fighter .art-wrap{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%}
.fighter.giant svg.art{max-height:min(48vh,460px)!important}
.fighter svg.art{height:100%;max-height:min(34vh,330px);width:auto;max-width:100%}
.fighter .art-wrap{animation:bob 2.6s ease-in-out infinite}
.enemy .art-wrap{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.hud{width:min(100%,320px);display:flex;flex-direction:column;gap:3px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:5px 9px;box-sizing:border-box}
.hud .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.hud .nm small{font-family:var(--f-body);font-size:.85rem;color:var(--ink-soft);font-weight:400}
.bar{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--cinnabar);transition:width .4s ease}
.bar.hero i{background:var(--jade)}
.bar.shield{height:10px}
.bar.shield i{background:var(--sky)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.powers{display:flex;gap:6px;flex-wrap:wrap}
.power{font-size:.8rem;background:var(--ink);color:var(--card);border-radius:999px;padding:2px 9px}
.skillbtn{border:2px solid var(--ink);border-radius:9px;background:var(--card);padding:3px 8px;font-weight:700;font-size:.85rem;display:flex;gap:5px;align-items:center}
.skillbtn small{font-size:.72rem;background:var(--ink);color:var(--card);border-radius:999px;padding:0 6px}
.skills{display:flex;gap:4px;flex-wrap:wrap}
.energy{display:flex;align-items:center;gap:6px;font-size:.8rem;flex-wrap:wrap}
.energy .pips{display:flex;gap:3px}
.energy .pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card)}
.energy .pips i.on{background:var(--gold)}
.wl{background:var(--cinnabar);color:var(--card);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.partbox{border:3px solid var(--gold);background:var(--card);border-radius:14px;padding:12px 18px;display:flex;flex-direction:column;gap:6px;max-width:640px;text-align:left;font-size:1.05rem}
.partbox h3{font-size:1.8rem;color:var(--cinnabar);text-align:center}
.partrow{display:flex;align-items:center;gap:14px}
.partrow svg.chest{height:70px;width:auto;flex:none}
.warnline{color:var(--cinnabar);font-weight:700}
.sklist p{margin:4px 0}
.sklist p.locked{opacity:.55}
.skillbtn .pips{display:flex;gap:3px}
.skillbtn .pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.skillbtn .pips i.on{background:var(--gold)}
.skillbtn.ready{background:var(--gold);animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(201,143,23,.35)}}
.skillbtn:disabled{cursor:not-allowed}
.buffs{font-size:.85rem;color:var(--cinnabar);font-weight:700;min-height:1.1em}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center;z-index:1}
.vs{font-family:var(--f-display);font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;background:var(--cinnabar);color:var(--card);border-radius:8px;transform:rotate(-5deg)}
.combo{font-family:var(--f-display);font-size:1.4rem;color:var(--cinnabar);font-weight:700;min-height:1.6em;text-align:center;border-radius:999px;padding:0 10px}
.combo:not(:empty){background:var(--card);border:2px solid var(--ink)}
.combo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
.fighter.lunge-r .art-wrap{animation:lungeR .45s ease}
.fighter.lunge-l .art-wrap{animation:lungeL .45s ease}
@keyframes lungeR{40%{transform:translateX(70px) rotate(4deg)}}
@keyframes lungeL{40%{transform:translateX(-70px) rotate(-4deg)}}
.fighter.hurt .art-wrap{animation:hurt .45s ease}
@keyframes hurt{20%{transform:translateX(-10px);filter:sepia(1) saturate(6) hue-rotate(-40deg)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}}
.fighter.dead .art-wrap{animation:inkout 1s forwards}
@keyframes inkout{to{opacity:0;transform:translateY(20px) scale(.9);filter:blur(6px)}}
.float{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:700;font-size:2.4rem;pointer-events:none;animation:floatup 1.1s ease-out forwards;z-index:5;white-space:nowrap;text-shadow:2px 2px 0 var(--card),-2px -2px 0 var(--card)}
.float.dmg{color:var(--cinnabar)}
.float.heal{color:var(--jade)}
.float.blue{color:var(--sky)}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(1.2)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.slash{position:absolute;inset:10% 0 10% 0;width:100%;height:80%;pointer-events:none;z-index:4}
.slash path{stroke-dasharray:420;stroke-dashoffset:420;animation:slash .5s ease-out forwards}
@keyframes slash{60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}

.desk{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:12px;position:relative}
.timer{position:absolute;left:12px;right:12px;top:-2px;height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--cinnabar);width:100%}
.qbox{display:flex;gap:12px;align-items:center;min-width:0}
.qtext{font-size:clamp(1.25rem,2.3vw,1.95rem);line-height:1.55;min-width:0;overflow-wrap:anywhere}
.qtag{display:inline-block;font-size:.8rem;background:var(--paper-2);border-radius:999px;padding:1px 10px;margin-bottom:4px;color:var(--ink-soft);font-weight:700}
.qfig{flex:none}
.qfig svg{height:clamp(110px,20vh,170px);width:auto;display:block}
.answer{display:flex;flex-direction:column;gap:6px;min-width:0}
.ansline{display:flex;align-items:center;gap:8px}
.ansbox{flex:1;min-width:0;min-height:52px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;letter-spacing:.06em;overflow:hidden}
.ansbox:empty::before{content:"输入答案";font-size:1.1rem;color:var(--ink-soft);letter-spacing:0;font-weight:400}
.ansunit{font-family:var(--f-display);font-size:1.6rem;font-weight:700}

.weapon{transform-box:view-box}

.amb.rain{background:var(--c);opacity:.35;transform:rotate(18deg)}
.amb.puff{border-radius:50%;opacity:.35;filter:blur(6px)}
.m-fall{animation:ambFall linear infinite}
.m-rain{animation:ambRain linear infinite}
.m-rise{top:auto;bottom:-6%;animation:ambRise linear infinite}
.m-drift{animation:ambDrift linear infinite}
.m-twinkle{top:auto;animation:ambTwinkle ease-in-out infinite}

@keyframes ambDrift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
@keyframes ambTwinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}

.groundink{position:absolute;left:18%;bottom:-3%;width:64%;height:auto;z-index:-1;pointer-events:none;opacity:.5}

.trophy{color:var(--gold);font-weight:700}

.spinr{animation:spinr .45s linear infinite}

.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}

.slots{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:hurt .45s}
.loot{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .5s}
.loot svg{width:80px;height:80px}
.loot .nm{font-family:var(--f-display);font-size:2rem;font-weight:700}
.closex{position:absolute;right:10px;top:8px;border:2px solid var(--ink);background:var(--paper);border-radius:8px;padding:2px 10px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:1.05rem;pointer-events:none}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const INK='#1d1b18',RED='#b5352b',GOLD='#d89b1d',PAPER='#f8f1e2',JADE='#2e6a58';

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,dur,type='sine',vol=.14,delay=0){if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur=.18,vol=.25){if(!S.sound)return;const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*dur);const b=c.createBuffer(1,n,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}

const MUSIC={cur:null,timer:null,step:0,next:0,gain:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
function mNote(f,t,dur,type,vol){const c=AC,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(MUSIC.gain);o.start(t);o.stop(t+dur+.05)}
function mNoise(t,dur,freq,vol,typ='bandpass'){const c=AC,n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=typ;f.frequency.value=freq;const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(MUSIC.gain);s.start(t)}
function mKick(t){const c=AC,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(MUSIC.gain);o.start(t);o.stop(t+.3)}
function playStep(T,i,t,dt){const m=T.mel[i];if(m)mNote(mf(m),t,dt*1.8,T.lead,T.lead==='square'?.05:.11);const b=T.bass[i];if(b)mNote(mf(b),t,dt*1.6,'sine',.22);
 const d=T.drum[i];if(d==='k')mKick(t);else if(d==='s')mNoise(t,.12,1800,.22);else if(d==='h')mNoise(t,.04,7000,.08,'highpass')}
function musicStart(name){if(!S.music)return;const c=ac();if(!c)return;if(MUSIC.cur===name&&MUSIC.timer)return;musicStop();
 MUSIC.cur=name;MUSIC.step=0;MUSIC.next=c.currentTime+.1;MUSIC.gain=c.createGain();MUSIC.gain.gain.value=.32;MUSIC.gain.connect(c.destination);
 MUSIC.timer=setInterval(()=>{const T=TRACKS[MUSIC.cur];if(!T||!MUSIC.gain)return;const dt=60/T.bpm/2;while(MUSIC.next<AC.currentTime+.2){playStep(T,MUSIC.step%32,MUSIC.next,dt);MUSIC.step++;MUSIC.next+=dt}},50)}
function musicStop(){if(MUSIC.timer){clearInterval(MUSIC.timer);MUSIC.timer=null}if(MUSIC.gain&&AC){const g=MUSIC.gain;try{g.gain.setTargetAtTime(0,AC.currentTime,.08)}catch(e){}setTimeout(()=>{try{g.disconnect()}catch(e){}},600)}MUSIC.gain=null;MUSIC.cur=null}

function startBattle(ch,lv){
 mapTab=CHAPTERS[ch-1].tower||1;
 const C=CHAPTERS[ch-1],isBoss=lv===5,m=ch>=13?3.8+.25*(ch-13):ch>=11?3.2+.25*(ch-11):ch>=9?2.6+.25*(ch-9):ch>=6?2+.2*(ch-6):1+.25*(ch-1);let e;
 if(isBoss)e={name:C.boss.name,art:C.boss.art,opt:{},max:Math.round(100*m),atk:Math.round(12+1.5*ch),powers:C.boss.powers.slice()};
 else{const[n,a,o]=C.enemies[lv-1];e={name:n,art:a,opt:o,max:Math.round((36+lv*6)*m),atk:6+ch+lv,powers:[]}}
 const bh=BEHAV[e.art]||{blk:.2,ctr:.15,verb:'格挡'};e.blk=bh.blk;e.ctr=bh.ctr;e.verb=bh.verb;
 S.seen=S.seen||{};if(!S.seen[e.name]){S.seen[e.name]=true;save()}
 e.sk=MSKILL[e.art]||MSKILL.blob;e.rage=0;e.rageMax=isBoss?3:4;
 const wl=worldLv();e.lvl=wl;e.max=Math.round(e.max*(1+.1*wl));e.atk=Math.round(e.atk*(1+.05*wl));e.sk2=wl>=1?MSKILL2[e.art]:null;e.burn=0;
 e.hp=e.max;e.shieldMax=e.powers.includes('shield')?Math.round(e.max*.3):0;e.shield=e.shieldMax;
 const hs=heroStats();
 let d;if(ch>=6)d=isBoss?3:(lv<=2?2:3);else if(ch===5)d=isBoss?3:(lv<=2?2:pick([2,3]));else d=isBoss?pick([2,3]):(lv<=2?1:2);
 B={skills:SKILLS[S.cur].filter(x=>x.unlock<=wl),ch,lv,isBoss,C,e,d,hero:{hp:hs.hp,max:hs.hp,atk:hs.atk},combo:0,gauge:0,blocks:0,poison:0,weak:0,rights:0,wrongs:0,regenUsed:false,busy:true,over:false};
 renderBattle();show('battle');musicStart(isBoss?'boss':(C.tower===5?'horror':(C.tower||1)>=2?'tower':'battle'));keyHandler=battleKey;startWalk()}

 demon:['rise','ember',['#ff7a2a','#ffd23a']],clouds:['drift','puff',['#ffffff']],ice:['fall','snow',['#ffffff']],sky:['twinkle','star',['#fff6c8','#ffffff']],
 reef:['rise','bubble',['#ffffff']],seapalace:['rise','bubble',['#cfeefa']],volcano:['rise','ember',['#ff7a2a','#ffd23a']],moon:['fall','petal',['#e8c23a','#f6e9b8']]};
function ambientHTML(bg){const a=AMB[bg];if(!a)return'';const[mode,shape,cols]=a;const n=mode==='rain'?40:mode==='drift'?6:20;let h='';
 for(let i=0;i<n;i++){const left=(i*53)%100,dur=mode==='rain'?.7+(i%5)*.12:mode==='drift'?18+(i%4)*6:5+(i%7)*1.3,delay=-((i*1.7)%dur),sz=shape==='puff'?60+(i%3)*30:shape==='rain'?2:4+(i%4)*2.5;
  h+=`<span class="amb ${shape} m-${mode}" style="left:${left}%;width:${sz}px;height:${shape==='rain'?22:shape==='puff'?sz*.4:sz}px;animation-duration:${dur}s;animation-delay:${delay}s;--c:${cols[i%cols.length]};top:${mode==='drift'?(10+(i*17)%50)+'%':''}"></span>`}
 return `<div class="ambient" aria-hidden="true">${h}</div>`}
const groundInk=(c)=>`<svg class="groundink" viewBox="0 0 200 40" aria-hidden="true"><g filter="url(#rough)"><path d="M14 26 Q60 14 110 22 Q150 28 188 18" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" opacity=".35"/><path d="M40 32 Q90 26 150 32" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".3"/><circle cx="24" cy="14" r="3" fill="${c}" opacity=".4"/><circle cx="176" cy="30" r="2.5" fill="${c}" opacity=".4"/><circle cx="160" cy="10" r="2" fill="${c}" opacity=".35"/></g></svg>`;

function shoot(from,to,kind,cb){const ar=$('.arena'),a=$(from+' .art-wrap'),b=$(to+' .art-wrap');if(!ar||!a||!b){cb&&cb();return}
 const R=ar.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
 const x1=ra.left+ra.width/2-R.left,y1=ra.top+ra.height*.4-R.top,x2=rb.left+rb.width/2-R.left,y2=rb.top+rb.height*.5-R.top;
 const el=document.createElement('div');el.className='proj'+(x2<x1?' flip':'');el.innerHTML=projSVG(kind);ar.appendChild(el);

 const mv=pick([{n:'跳劈',arc:-90,r:-14,end:4},{n:'旋风斩',arc:-30,r:180,end:364},{n:'突刺',arc:-6,r:2,end:4}]);floatText('#fHero',mv.n+'！','blue','0%');

 a.onfinish=cb}

 h.animate([{transform:`translate(${dx}px,0) rotate(4deg)`},{transform:`translate(${dx-18}px,-4px) rotate(-10deg)`,offset:.35},{transform:`translate(${dx+26}px,-8px) rotate(14deg)`,offset:.7},{transform:`translate(${dx}px,0) rotate(4deg)`}],{duration:200,easing:'ease-out'})}

 const a=h.animate([{transform:`translate(${dx}px,0) rotate(4deg)`},{transform:`translate(${dx*.5}px,-26px) rotate(-8deg)`},{transform:'translate(0,0) rotate(0)'}],{duration:Math.min(380,200+dx*.3),easing:'ease-out',fill:'forwards'});

/* player special skill */
function useSkill(i){if(!B||B.over||B.busy||B.review||B.def)return;const x=B.skills[i];if(!x||B.gauge<x.cost)return;
 B.gauge-=x.cost;B.busy=true;pad.lock(true);updateHud();const k=S.cur,a=B.hero.atk,e=B.e;
 cutIn('hero',ART[k](),x.name,x.desc,()=>{if(!B||B.over)return;
  const done=()=>{if(!B)return;updateHud();if(B.e.hp<=0){enemyDown();return}B.busy=false;pad.lock(false);updateHud()};
  const heal=h=>{h=Math.round(h);B.hero.hp=Math.min(B.hero.max,B.hero.hp+h);floatText('#fHero','+'+h,'heal');updateHud()};
  if(x.heal)heal(B.hero.max*x.heal);
  if(x.clear){B.poison=0;B.weak=0}
  if(x.block){B.blocks+=x.block;guardFx('#fHero');floatText('#fHero','护体 ×'+B.blocks,'blue','6%')}
  if(x.burn){e.burn=x.burn;floatText('#fEnemy','燃烧！','dmg','6%')}
  if(x.rage0){e.rage=0;floatText('#fEnemy','怒气清空','blue','20%')}
  if(x.rageMinus){e.rage=Math.max(0,e.rage-x.rageMinus);floatText('#fEnemy','怒气 −'+x.rageMinus,'blue','20%')}
  if(x.eweak){e.atk=Math.max(1,Math.round(e.atk*(1-x.eweak)));floatText('#fEnemy','攻击力 ↓','blue','34%')}
  updateHud();
  const buff=x.heal||x.block||x.clear||x.burn||x.rage0||x.rageMinus||x.eweak;
  if(buff)powerUp(x.fx||'gold');
  const sfx=SKILL_FX[x.name];if(sfx)try{sfx()}catch(err){}
  if(!x.hits){setTimeout(done,700);return}
  const dmg=x.pmax?Math.round(e.max*x.pmax):Math.max(1,Math.round(a*x.mult));
  setTimeout(()=>heroAttackSeq(x.hits,dmg,x.fx,!!x.ign,()=>{if(x.steal)heal(dmg)},done),sfx?560:buff?480:0)})}

 if(win){coins=b.isBoss?80+30*b.ch+(b.wrongs===0?40:0):20+5*b.ch+(b.wrongs===0?10:0);if(S.prog[b.ch]<b.lv)S.prog[b.ch]=b.lv;S.stats.wins++;SFX.win();
  if(b.isBoss&&!S.partDone[b.ch]){S.partDone[b.ch]=true;S.chests.push(2);coins+=50;partWin=true}
  if(b.isBoss){drop=b.ch>=11?8:b.ch>=6?3:1;
   const tw=b.C.tower||1,rr=tw===1?pick([1,2]):tw===2?2:tw===3?pick([2,3]):tw===4?pick([3,4]):4;const ty=Math.random()<.5?'w':'a';const[lo,hi]=RANGE[ty][rr];
   const bi={id:S.nextId++,type:ty,rar:rr,val:ri(lo,hi),name:pick(NAMES[ty][rr])};S.inv.push(bi);S.potions=S.potions||{};const pots=[pick(Object.keys(POTIONS)),pick(Object.keys(POTIONS))];pots.forEach(k=>S.potions[k]=(S.potions[k]||0)+1);

  ${drop!==null?`<div class="dropline">${chestSVG(drop)}<span>${b.isBoss?'首领掉落':'全对奖励'}：<b>${CHESTS[drop].name}</b> 已放进商店</span></div>`:''}

function renderShop(){
 const el=$('#scr-shop');const t2=tower2Open();S.potions=S.potions||{};
 const tabs=`<div class="tabs"><button type="button" class="tab ${shopTab==='chest'?'on':''}" data-st="chest">宝箱${S.chests.length?`（${S.chests.length}个待开）`:''}</button><button type="button" class="tab ${shopTab==='cloud'?'on':''}" data-st="cloud">云霄商店</button><button type="button" class="tab ${shopTab==='sell'?'on':''}" data-st="sell">出售装备</button><button type="button" class="tab ${shopTab==='code'?'on':''}" data-st="code">兑换码</button></div>`;
 let body='';
 if(shopTab==='chest')body=`<p class="muted" style="margin:0 0 10px">用金币买宝箱，答对一道题就能打开。打首领、全对过关也会掉宝箱。</p>
 <div class="grid3">${CHESTS.map((c,i)=>`<div class="card">${chestSVG(i)}<h3>${c.name}</h3>
  <div class="odds">${c.w?(c.type?`<span style="background:var(--ink)">只出${c.type==='w'?'武器':'盔甲'}</span>`:'')+c.w.map((w,r)=>w?`<span style="background:${RAR[r].c}">${RAR[r].n} ${w}%</span>`:'').join(''):`<span style="background:var(--jade)">${c.odds}</span>`}</div>
  <div class="price"><span class="coin-ico"></span>${c.price}</div>
  <button class="btn ${S.coins>=c.price?'primary':''}" type="button" data-buy="${i}" ${S.coins>=c.price?'':'disabled'}>${S.coins>=c.price?'购买并开启':'金币不够'}</button></div>`).join('')}</div>
 <div class="pending"><h3>还没打开的宝箱</h3>${S.chests.length?`<div class="pending-list">${S.chests.map((t,i)=>`<div class="pchest">${chestSVG(t)}<b>${CHESTS[t].name}</b><button class="chipbtn" type="button" data-open="${i}">开启</button></div>`).join('')}</div>`:'<div class="empty">没有待开启的宝箱。打赢战斗赚金币，再来买吧！</div>'}</div>`;
 else if(shopTab==='cloud')body=`<p class="muted" style="margin:0 0 10px">云霄商店的东西不用开箱，买了就是你的。药品带进战斗里，在答题时点一下就能用。</p>
 <h3 class="shoph">药品</h3><div class="grid3">${Object.keys(POTIONS).map(k=>{const P=POTIONS[k],ok=S.coins>=P.price;return `<div class="card">${potionIcon(k).replace('<svg','<svg class="picon"')}<h3>${P.name}</h3><p style="margin:0">${P.desc}</p><p class="muted" style="margin:0">已有 ${S.potions[k]||0} 个</p>
  <div class="price"><span class="coin-ico"></span>${P.price}</div><button class="btn ${ok?'primary':''}" type="button" data-pot="${k}" ${ok?'':'disabled'}>${ok?'购买':'金币不够'}</button></div>`}).join('')}</div>
 <h3 class="shoph">云霄神兵 · 龙宫宝甲</h3><div class="grid3">${CLOUD_GEAR.map(g=>{const lock=(g.t2&&!t2)||(g.t3&&!tower3Open())||(g.t4&&!tower4Open()),owned=S.inv.some(i=>i.ck===g.key),ok=S.coins>=g.price;return `<div class="card ${lock?'locked':''}">${itemIcon(g).replace('<svg','<svg class="picon"')}<span class="tag" style="background:${RAR[g.rar].c};color:${PAPER};border-radius:999px;padding:1px 10px;font-size:.85rem">${RAR[g.rar].n}${g.type==='w'?'武器':'盔甲'}</span><h3>${g.name}</h3><p style="margin:0">${g.type==='w'?'攻击':'生命'} +${g.val}</p>
  <div class="price"><span class="coin-ico"></span>${g.price}</div>${lock?`<button class="btn" type="button" disabled>${g.t4?'打败东海龙王后上架':g.t3?'打败天狗后上架':'打败墨魔王后上架'}</button>`:owned?'<button class="btn" type="button" disabled>已拥有</button>':`<button class="btn ${ok?'primary':''}" type="button" data-gear="${g.key}" ${ok?'':'disabled'}>${ok?'购买':'金币不够'}</button>`}</div>`}).join('')}</div>`;
 else if(shopTab==='sell'){const list=S.inv.slice().sort((a,b)=>a.rar-b.rar||a.val-b.val);const commons=list.filter(x=>x.rar===0&&S.eq[x.type]!==x.id);
  body=`<p class="muted" style="margin:0 0 10px">不想要的武器和盔甲可以卖掉换金币。正在装备的不能卖。价格：普通 10 · 稀有 30 · 史诗 80 · 传说 200 · 神话 400（云霄神兵按半价收）。</p>
  ${commons.length?`<div class="row" style="margin-bottom:10px"><button class="btn gold" type="button" id="sellCommon">一键卖掉所有普通装备（${commons.length}件，+${commons.length*SELL[0]}金币）</button></div>`:''}
  ${list.length?`<div class="inv">${list.map(it=>{const eq=S.eq[it.type]===it.id;return `<div class="item ${eq?'eq':''}">${itemIcon(it)}<span class="tag" style="background:${RAR[it.rar].c}">${RAR[it.rar].n}${it.type==='w'?'武器':'盔甲'}</span><span class="nm">${it.name}</span><span>${it.type==='w'?'攻击':'生命'} +${it.val}</span>${eq?'<button type="button" disabled>装备中</button>':`<button type="button" data-sell="${it.id}">卖 +${sellPrice(it)}金币</button>`}</div>`}).join('')}</div>`:'<div class="empty">背包是空的，没有可以卖的装备。</div>'}`}
 else body=`<div class="codebox"><h3>输入兑换码</h3><p class="muted" style="margin:0">老师会在课堂上给你兑换码。每个兑换码只能用一次。</p>
  <form id="codeForm" class="row"><input id="codeIn" type="text" autocomplete="off" maxlength="20" placeholder="例如：MOXIA100" aria-label="兑换码"><button class="btn primary" type="submit">兑换</button></form>
  <div class="codemsg" id="codeMsg">${codeMsg}</div></div>`;
 el.innerHTML=`<div class="sec-head"><h2>商店</h2><button class="btn" type="button" id="sBack">返回地图</button></div>${tabs}${body}`;
 el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.st;codeMsg='';renderShop()});
 el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const t=+b.dataset.buy;if(S.coins<CHESTS[t].price)return;S.coins-=CHESTS[t].price;S.chests.push(t);save();updateCoins(true);SFX.coin();openChest(S.chests.length-1)});
 el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openChest(+b.dataset.open));
 el.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const it=S.inv.find(x=>x.id===+b.dataset.sell);const v=sellItem(+b.dataset.sell);if(!v)return;save();updateCoins(true);SFX.coin();toast(`卖掉了 ${it.name}，得到 ${v} 金币`);renderShop()});
 const sc2=$('#sellCommon');if(sc2)sc2.onclick=()=>{let t=0;S.inv.filter(x=>x.rar===0&&S.eq[x.type]!==x.id).map(x=>x.id).forEach(id=>t+=sellItem(id));save();updateCoins(true);SFX.coin();toast(`卖掉了普通装备，得到 ${t} 金币`);renderShop()};
 el.querySelectorAll('[data-pot]').forEach(b=>b.onclick=()=>{const k=b.dataset.pot,P=POTIONS[k];if(S.coins<P.price)return;S.coins-=P.price;S.potions[k]=(S.potions[k]||0)+1;save();updateCoins(true);SFX.coin();toast('买到了 '+P.name);renderShop()});
 el.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const g=CLOUD_GEAR.find(x=>x.key===b.dataset.gear);if(!g||S.coins<g.price)return;S.coins-=g.price;const it={id:S.nextId++,type:g.type,rar:g.rar,val:g.val,name:g.name,ck:g.key};S.inv.push(it);S.eq[g.type]=it.id;save();updateCoins(true);SFX.chest();toast('已装备 '+g.name);renderShop()});
 const f=$('#codeForm');if(f)f.onsubmit=ev=>{ev.preventDefault();const code=$('#codeIn').value.trim().toUpperCase().replace(/\s+/g,'');S.codes=S.codes||{};const C=CODES[code];
  if(!code)codeMsg='请先输入兑换码。';else if(!C)codeMsg=`<span class="bad">兑换码“${code.replace(/[<>&"]/g,'')}”不对，请检查后再试。</span>`;else if(S.codes[code])codeMsg='<span class="bad">这个兑换码已经用过了。</span>';
  else{C.f();S.codes[code]=true;save();updateCoins(true);SFX.chest();codeMsg=`<span class="good">兑换成功：${C.txt}！</span>`}
  renderShop();const i=$('#codeIn');if(i)i.focus()};
 $('#sBack').onclick=renderMap;
 const sc=el.scrollTop;show('shop');el.scrollTop=sc}

function rollItem(tier){const w=CHESTS[tier].w;let r=Math.random()*100,rar=0;for(let i=0;i<w.length;i++){if(r<w[i]){rar=i;break}r-=w[i]}
 const type=CHESTS[tier].type||(Math.random()<.5?'w':'a');const[lo,hi]=RANGE[type][rar];return{id:S.nextId++,type,rar,val:ri(lo,hi),name:pick(NAMES[type][rar])}}

let chestCtx=null;
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';chestCtx=null;if(screen==='shop')renderShop()}
function openChest(idx){
 const tier=S.chests[idx];const m=$('#modal');
 m.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="开宝箱"><button class="closex" type="button" id="cClose">稍后再开</button>
  <h3>${CHESTS[tier].name}</h3><div class="chest-stage" id="cStage">${chestSVG(tier)}</div>
  <div id="cBody"></div></div>`;
 m.hidden=false;$('#cClose').onclick=closeModal;
 chestCtx={idx,tier};askChest()}
function askChest(){const ctx=chestCtx;if(!ctx)return;const topic=pick(['u1','u2','u3','u4']);const q=genQ(topic,(CHESTS[ctx.tier]||{d:2}).d);ctx.q=q;
 const body=$('#cBody');
 body.innerHTML=`<div class="qbox" style="margin-bottom:10px"><div class="qtext"><span class="qtag">开锁题 · ${TOPIC_NAME[topic]}</span><br>${q.text}</div>${q.fig?`<div class="qfig">${q.fig}</div>`:''}</div><div class="answer" id="cPad"></div>`;
 const p=makePad($('#cPad'),v=>{p.lock(true);if(Number(v)===q.ans)chestOpen();else chestWrong()});p.setUnit(q.unit);
 keyHandler=k=>p.press(k)}
function chestWrong(){SFX.wrong();const q=chestCtx.q;const st=$('#cStage svg');st.classList.remove('shake');void st.getBoundingClientRect();st.classList.add('shake');
 $('#cBody').innerHTML=`<div class="feedback wrong" style="position:static"><span class="big">锁没打开</span><div class="exp"><b>正确答案：${N(q.ans)}${q.unit&&q.unit!=='位数'?' '+q.unit:''}</b><br>${q.explain}</div><button class="btn primary" type="button" id="cRetry">换一题再试</button></div>`;
 $('#cRetry').onclick=askChest;keyHandler=k=>{if(k==='Enter'){askChest();return true}return false}}
function chestOpen(){const ctx=chestCtx;SFX.chest();S.chests.splice(ctx.idx,1);const CH=CHESTS[ctx.tier]||CHESTS[0];S.potions=S.potions||{};
 $('#cStage svg').classList.add('opened');$('#cClose').textContent='关闭';keyHandler=null;
 let kind=CH.kind;if(kind==='mystery'){const r=Math.random();kind=r<.4?'item':r<.7?'coins':'potion'}
 if(kind==='coins'){const n=ri(60,250);S.coins+=n;save();updateCoins(true);
  $('#cBody').innerHTML=`<div class="loot"><div class="seal" style="font-size:1.4rem"><span class="coin-ico"></span><b>+${n}</b><small>金币</small></div><div class="nm" style="color:var(--gold)">金币大奖！</div><button class="btn primary" type="button" id="cKeep">收下</button></div>`;
  $('#cKeep').onclick=closeModal;return}
 if(kind==='potion'){const got={};for(let i=0;i<3;i++){const k=pick(Object.keys(POTIONS));got[k]=(got[k]||0)+1;S.potions[k]=(S.potions[k]||0)+1}save();
  $('#cBody').innerHTML=`<div class="loot"><div class="row" style="justify-content:center">${Object.keys(got).map(k=>`<div style="text-align:center">${potionIcon(k)}<div><b>${POTIONS[k].name} ×${got[k]}</b></div></div>`).join('')}</div><div class="muted">药品可以在战斗中点一下使用。</div><button class="btn primary" type="button" id="cKeep">收下</button></div>`;
  $('#cKeep').onclick=closeModal;return}
 const it=rollItem(CH.kind==='mystery'?1:ctx.tier);if(CH.kind==='mystery'){const r=Math.random()*100;it.rar=r<10?0:r<50?1:r<85?2:3;const[lo,hi]=RANGE[it.type][it.rar];it.val=ri(lo,hi);it.name=pick(NAMES[it.type][it.rar])}
 S.inv.push(it);save();
 const cur=it.type==='w'?S.inv.find(i=>i.id===S.eq.w):S.inv.find(i=>i.id===S.eq.a);
 const better=!cur||it.val>cur.val;
 $('#cBody').innerHTML=`<div class="loot">${itemIcon(it)}<span style="background:${RAR[it.rar].c};color:${PAPER};border-radius:999px;padding:1px 10px;font-size:.9rem">${RAR[it.rar].n}${it.type==='w'?'武器':'盔甲'}</span>
  <div class="nm" style="color:${RAR[it.rar].c}">${it.name}</div><div style="font-size:1.3rem;font-weight:700">${it.type==='w'?'攻击':'生命'} +${it.val}</div>
  <div class="muted">${cur?`现在装备的是 ${cur.name}（+${cur.val}）`:'你还没有装备这一类物品'}</div>
  <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ${better?'primary':''}" type="button" id="cEquip">立即装备</button><button class="btn" type="button" id="cKeep">放进背包</button><button class="btn" type="button" id="cSell">卖掉 +${sellPrice(it)}金币</button></div></div>`;
 $('#cEquip').onclick=()=>{S.eq[it.type]=it.id;save();toast('已装备 '+it.name);closeModal()};
 $('#cSell').onclick=()=>{const v=sellItem(it.id);save();updateCoins(true);SFX.coin();toast(`卖掉了 ${it.name}，得到 ${v} 金币`);closeModal()};
 $('#cKeep').onclick=closeModal}

/* ============ GEAR ============ */
let resetArmed=false;
function renderGear(){
 const el=$('#scr-gear');const hs=heroStats();const c=CHARS[S.cur];
 const inv=S.inv.slice().sort((a,b)=>a.type.localeCompare(b.type)||b.rar-a.rar||b.val-a.val);
 const slot=(it,label)=>`<div class="slot">${it?itemIcon(it):'<svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="8" fill="none" stroke="#575046" stroke-width="2" stroke-dasharray="4 4"/></svg>'}<div><div class="muted" style="font-size:.8rem">${label}</div><b>${it?`${it.name} +${it.val}`:'空'}</b></div></div>`;
 el.innerHTML=`<div class="sec-head"><h2>角色与装备</h2><button class="btn" type="button" id="gBack">返回地图</button></div>
 <div class="gear-top">${ART[S.cur]()}<div><h3 style="font-size:2rem">${c.name}</h3>
  <div class="statline"><span>攻击 <b>${hs.atk}</b> <small class="muted">(${c.atk}${hs.w?' + '+hs.w.val:''})</small></span><span>生命 <b>${hs.hp}</b> <small class="muted">(${c.hp}${hs.a?' + '+hs.a.val:''})</small></span></div>
  <div class="sklist">${SKILLS[S.cur].map(x=>{const lk=x.unlock>worldLv();return `<p class="${lk?'locked':''}"><b>${x.name}</b>（${x.cost}点能量）：${x.desc}${lk?`<span class="muted">（完成${x.unlock}个部分后解锁）</span>`:''}</p>`}).join('')}<p class="muted">每答对一题得1点能量，最多${GAUGE_MAX}点。</p></div>
  <div class="slots">${slot(hs.w,'武器')}${slot(hs.a,'盔甲')}</div></div></div>
 <h3 style="font-size:1.5rem;margin-bottom:8px">角色</h3>
 <div class="chars">${CHAR_ORDER.map(k=>{const C=CHARS[k],own=S.chars.includes(k),cur=S.cur===k;return `<div class="card charcard ${cur?'cur':''}">${ART[k]()}<h3>${C.name}</h3><p>生命 ${C.hp} · 攻击 ${C.atk} · 普攻「${HERO_ATK[k].name}」</p><p class="muted">技能：${SKILLS[k].map(x=>x.name).join('、')}</p>
  ${cur?'<button class="btn" type="button" disabled>使用中</button>':own?`<button class="btn primary" type="button" data-use="${k}">选择</button>`:`<button class="btn gold" type="button" data-hire="${k}" ${S.coins>=C.price?'':'disabled'}>招募 · ${C.price}金币</button>`}</div>`}).join('')}</div>
 <h3 style="font-size:1.5rem;margin-bottom:8px">背包（${S.inv.length}）</h3>
 ${inv.length?`<div class="inv">${inv.map(it=>{const eq=S.eq[it.type]===it.id;return `<div class="item ${eq?'eq':''}">${itemIcon(it)}<span class="tag" style="background:${RAR[it.rar].c}">${RAR[it.rar].n}${it.type==='w'?'武器':'盔甲'}</span><span class="nm">${it.name}</span><span>${it.type==='w'?'攻击':'生命'} +${it.val}</span>${eq?'<button type="button" disabled>已装备</button>':`<div class="row" style="gap:4px;justify-content:center"><button type="button" data-eq="${it.id}">装备</button><button type="button" data-gsell="${it.id}">卖 +${sellPrice(it)}</button></div>`}</div>`}).join('')}</div>`:'<div class="empty">背包是空的。去商店开宝箱，就能得到武器和盔甲。</div>'}
 <div class="danger"><span class="muted">金币和装备会一直保存在这台电脑的浏览器里。</span>${resetArmed?'<b style="color:var(--cinnabar)">确定要清除全部金币、角色和装备吗？</b><button class="solid" type="button" id="gResetYes">确定清除</button><button type="button" id="gResetNo">取消</button>':'<button type="button" id="gReset">清除存档</button>'}</div>`;
 $('#gBack').onclick=()=>{resetArmed=false;renderMap()};
 el.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.use;save();renderGear()});
 el.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{const k=b.dataset.hire;if(S.coins<CHARS[k].price)return;S.coins-=CHARS[k].price;S.chars.push(k);S.cur=k;save();updateCoins(true);SFX.chest();toast('招募成功：'+CHARS[k].name);renderGear()});
 el.querySelectorAll('[data-gsell]').forEach(b=>b.onclick=()=>{const it=S.inv.find(x=>x.id===+b.dataset.gsell);const v=sellItem(+b.dataset.gsell);if(!v)return;save();updateCoins(true);SFX.coin();toast(`卖掉了 ${it.name}，得到 ${v} 金币`);renderGear()});
 el.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{const it=S.inv.find(i=>i.id===+b.dataset.eq);S.eq[it.type]=it.id;save();SFX.coin();renderGear()});
 if($('#gReset'))$('#gReset').onclick=()=>{resetArmed=true;renderGear()};
 if($('#gResetNo'))$('#gResetNo').onclick=()=>{resetArmed=false;renderGear()};
 if($('#gResetYes'))$('#gResetYes').onclick=()=>{const snd=S.sound;S=defaultSave();S.sound=snd;resetArmed=false;save();updateCoins();toast('存档已清除');renderGear()};
 const sc=el.scrollTop;show('gear');el.scrollTop=sc}

/* ============ BOOT ============ */
window.__moxia={genQ,toCN,BANK,ART,BG,updateHud,itemIcon,NAMES,get B(){return B},get CC(){return chestCtx}};
$('#soundBtn').textContent='音效：'+(S.sound?'开':'关');$('#musicBtn').textContent='音乐：'+(S.music?'开':'关');
updateCoins();renderHome();
})();
</script>

</html>
